name: Android CI

on:
  push:
    branches: [ "test", "master2", "koin" ]
  pull_request:
    branches: [ "test", "master2", "koin" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v3

      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          #cache: gradle

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execution permissions to Gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          # Esta opción genera un reporte detallado en el resumen del Job
          generate-job-summary: true

      # Nuevo paso para crear el archivo google-services.json
      - name: Create the google-services.json file
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json

      - name: Ejecutar Análisis de Código (Lint)
        run: ./gradlew lintDebug

      - name: Upload Lint Report
        if: always() # Esto asegura que se suba aunque el paso anterior falle
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Ejecutar Tests Unitarios (SOLID Validation)
        run: ./gradlew testDebugUnitTest

      - name: Compilar APK de Debug
        run: ./gradlew assembleDebug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

#      - name: Build app
#        run: ./gradlew assemble
